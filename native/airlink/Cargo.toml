[package]
name = "airlink"
version = "0.1.0"
edition = "2021"
description = "AirPointer's internet transport: iroh (peer-to-peer QUIC with relay fallback) behind a tiny C ABI and JNI."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# Media Foundation H.264 encoder for screen view (video_win.rs)
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Ole"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
